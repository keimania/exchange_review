<!-- Global Layout Controls, Dark Mode, Sidebar Filter, Table Search & Quick Actions -->
<div id="reading-progress-bar" aria-hidden="true"></div>

<aside id="floating-dock-handles" aria-label="사이드바 독 제어 핸들">
  <button id="handle-sidebar-left" class="edge-dock-handle left-handle" title="좌측 메뉴 열기 (단축키: [ )" aria-label="좌측 메뉴 열기">
    <span class="handle-icon">❯</span>
    <span class="handle-text">메뉴 열기</span>
  </button>
  <button id="handle-sidebar-right" class="edge-dock-handle right-handle" title="우측 목차 열기 (단축키: ] )" aria-label="우측 목차 열기">
    <span class="handle-icon">❮</span>
    <span class="handle-text">목차 열기</span>
  </button>
</aside>

<aside id="floating-quick-actions" class="floating-quick-actions" aria-label="빠른 도구 모음">
  <a id="fab-lang-switch" class="fab-btn fab-lang" href="#" style="display:none;" title="한/영 리포트 전환">🌐</a>
  <button type="button" id="fab-theme-toggle" class="fab-btn" title="다크/라이트 모드 전환 (단축키: D)" aria-label="테마 전환">🌙</button>
  <button type="button" id="fab-shortcuts" class="fab-btn" title="키보드 단축키 안내 (단축키: ?)" aria-label="단축키 안내">⌨️</button>
  <button type="button" id="fab-scroll-top" class="fab-btn fab-top" title="맨 위로 이동" aria-label="맨 위로 이동">↑</button>
</aside>

<div id="shortcuts-modal-backdrop" class="shortcuts-modal-backdrop" aria-hidden="true">
  <div class="shortcuts-modal" role="dialog" aria-labelledby="shortcuts-modal-title">
    <div class="shortcuts-modal-header">
      <span id="shortcuts-modal-title">⌨️ 빠른 키보드 단축키 안내</span>
      <button type="button" id="shortcuts-modal-close" class="shortcuts-close-btn" aria-label="닫기">✕</button>
    </div>
    <div class="shortcuts-list">
      <div class="shortcut-row"><kbd>/</kbd><span>페이지 내 검색창(홈·용어집·사이드바) 즉시 포커스</span></div>
      <div class="shortcut-row"><kbd>[</kbd><span>좌측 사이드바 메뉴 접기 / 펼치기</span></div>
      <div class="shortcut-row"><kbd>]</kbd><span>우측 목차(TOC) 사이드바 접기 / 펼치기</span></div>
      <div class="shortcut-row"><kbd>\</kbd><span>넓게 보기 (양쪽 사이드바 숨김 집중 독서 모드)</span></div>
      <div class="shortcut-row"><kbd>D</kbd><span>다크 모드 / 라이트 모드 즉시 전환</span></div>
      <div class="shortcut-row"><kbd>?</kbd><span>단축키 도움말 열기 / 닫기</span></div>
      <div class="shortcut-row"><kbd>Esc</kbd><span>열린 모달 닫기 또는 입력창 포커스 해제</span></div>
    </div>
  </div>
</div>

<script>
(function() {
  // Apply saved theme immediately to minimize flash
  const savedTheme = localStorage.getItem('exchange_theme');
  if (savedTheme === 'dark') {
    document.body.classList.add('dark-mode');
  }

  function initGlobalPortalUX() {
    const body = document.body;
    const leftSidebar = document.getElementById('quarto-sidebar');
    const rightSidebar = document.getElementById('quarto-margin-sidebar');
    const mainContent = document.getElementById('quarto-document-content');
    const isContentPageWithSidebars = !!(mainContent && (leftSidebar || rightSidebar));

    // 1. Inject Dark Mode button into Top Navbar
    injectNavbarThemeToggle();

    // 2. Setup Floating Action Buttons (Theme, Language Switch, Shortcuts, Scroll-to-Top)
    setupFloatingActions();

    // 3. Setup Reading Progress Bar
    setupReadingProgress();

    // 4. Setup Left Sidebar Quick Filter
    if (leftSidebar) {
      setupSidebarFilter(leftSidebar);
    }

    // 5. Setup Auto Table Filter on Large Comparison Tables (12+ rows, excluding custom interactive pages)
    if (mainContent && !document.getElementById('glossaryExplorer') && !document.getElementById('panel-nasdaq')) {
      setupSmartTableFilters(mainContent);
    }

    // 6. Content Page Layout Controls (Sidebar collapse, Focus mode, Font size)
    if (isContentPageWithSidebars) {
      const isTablet = window.innerWidth <= 1250;
      const savedLeft = localStorage.getItem('exchange_sidebar_left');
      const savedRight = localStorage.getItem('exchange_sidebar_right');
      const savedFocus = localStorage.getItem('exchange_focus_mode');
      const savedFontSize = localStorage.getItem('exchange_font_size');

      if (savedFontSize) {
        mainContent.style.fontSize = savedFontSize;
      }

      if (savedFocus === 'true') {
        body.classList.add('focus-mode-enabled', 'sidebar-left-collapsed', 'sidebar-right-collapsed');
      } else {
        if (savedLeft === 'collapsed') {
          body.classList.add('sidebar-left-collapsed');
        }
        if (savedRight === 'collapsed' || (isTablet && savedRight === null)) {
          body.classList.add('sidebar-right-collapsed');
        }
      }

      insertToolbar(mainContent);
      bindEdgeHandles();

      if (rightSidebar) {
        rightSidebar.addEventListener('click', function(e) {
          if (e.target.classList.contains('toc-close-trigger') || (e.clientY < 110 && e.clientX > window.innerWidth - 60)) {
            toggleRightSidebar();
          }
        });
      }
      updateToolbarButtons();
    }

    // 7. Global Keyboard Shortcuts
    document.addEventListener('keydown', function(e) {
      const modal = document.getElementById('shortcuts-modal-backdrop');
      if (e.key === 'Escape') {
        if (modal && modal.classList.contains('open')) {
          modal.classList.remove('open');
        } else if (document.activeElement) {
          document.activeElement.blur();
        }
        return;
      }

      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) {
        return;
      }

      if (e.key === '/') {
        const targetInput =
          document.getElementById('gSearchInput') ||
          document.getElementById('cardFilterInput') ||
          document.querySelector('.smart-table-filter-input') ||
          document.getElementById('sidebar-filter-input');
        if (targetInput) {
          e.preventDefault();
          targetInput.focus();
          targetInput.select();
        }
      } else if (e.key === 'd' || e.key === 'D') {
        e.preventDefault();
        toggleDarkMode();
      } else if (e.key === '?') {
        e.preventDefault();
        toggleShortcutsModal();
      } else if (isContentPageWithSidebars) {
        if (e.key === '[') {
          e.preventDefault();
          toggleLeftSidebar();
        } else if (e.key === ']') {
          e.preventDefault();
          toggleRightSidebar();
        } else if (e.key === '\\') {
          e.preventDefault();
          toggleFocusMode();
        }
      }
    });

    syncThemeIcons();
  }

  function injectNavbarThemeToggle() {
    const rightNav = document.querySelector('.navbar-nav.ms-auto');
    if (!rightNav || document.getElementById('nav-theme-btn')) return;

    const li = document.createElement('li');
    li.className = 'nav-item';
    li.innerHTML = `<button type="button" id="nav-theme-btn" class="nav-theme-toggle-btn" title="다크 모드 / 라이트 모드 전환 (단축키: D)" aria-label="테마 전환">🌙</button>`;
    rightNav.prepend(li);
    li.querySelector('button').addEventListener('click', toggleDarkMode);
  }

  function toggleDarkMode() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('exchange_theme', isDark ? 'dark' : 'light');
    syncThemeIcons();
  }

  function syncThemeIcons() {
    const isDark = document.body.classList.contains('dark-mode');
    const icon = isDark ? '☀️' : '🌙';
    const navBtn = document.getElementById('nav-theme-btn');
    const fabBtn = document.getElementById('fab-theme-toggle');
    const toolBtn = document.getElementById('btn-toggle-theme');
    if (navBtn) navBtn.textContent = icon;
    if (fabBtn) fabBtn.textContent = icon;
    if (toolBtn) {
      toolBtn.querySelector('.btn-icon').textContent = icon;
      toolBtn.querySelector('.btn-label').textContent = isDark ? '라이트 모드' : '다크 모드';
      toolBtn.classList.toggle('active', isDark);
    }
  }

  function setupFloatingActions() {
    const fabLang = document.getElementById('fab-lang-switch');
    const fabTheme = document.getElementById('fab-theme-toggle');
    const fabShort = document.getElementById('fab-shortcuts');
    const fabTop = document.getElementById('fab-scroll-top');

    // Detect counterpart language button if present
    const docLangBtn = document.querySelector('.doc-lang-btn');
    if (fabLang && docLangBtn && docLangBtn.getAttribute('href')) {
      fabLang.href = docLangBtn.getAttribute('href');
      const isTargetEn = docLangBtn.textContent.includes('English');
      fabLang.textContent = isTargetEn ? 'EN' : 'KO';
      fabLang.title = isTargetEn ? 'Switch to English Report' : '한국어 리포트로 전환';
      fabLang.style.display = 'inline-flex';
    }

    if (fabTheme) fabTheme.addEventListener('click', toggleDarkMode);
    if (fabShort) fabShort.addEventListener('click', toggleShortcutsModal);
    if (fabTop) {
      fabTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    const modal = document.getElementById('shortcuts-modal-backdrop');
    const closeBtn = document.getElementById('shortcuts-modal-close');
    if (closeBtn && modal) {
      closeBtn.addEventListener('click', () => modal.classList.remove('open'));
      modal.addEventListener('click', function(e) {
        if (e.target === modal) modal.classList.remove('open');
      });
    }
  }

  function toggleShortcutsModal() {
    const modal = document.getElementById('shortcuts-modal-backdrop');
    if (modal) modal.classList.toggle('open');
  }

  function setupReadingProgress() {
    const bar = document.getElementById('reading-progress-bar');
    const fabTop = document.getElementById('fab-scroll-top');
    if (!bar) return;

    function onScroll() {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const pct = docHeight > 100 ? Math.min(100, Math.max(0, (scrollTop / docHeight) * 100)) : 0;
      bar.style.width = pct + '%';
      if (fabTop) {
        fabTop.classList.toggle('visible', scrollTop > 280);
      }
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  function setupSidebarFilter(sidebar) {
    const nav = sidebar.querySelector('.sidebar-menu-container');
    if (!nav || document.getElementById('sidebar-filter-wrap')) return;

    const items = Array.from(nav.querySelectorAll('li.sidebar-item'));
    if (items.length < 6) return;

    const wrap = document.createElement('div');
    wrap.id = 'sidebar-filter-wrap';
    wrap.className = 'sidebar-filter-wrap';
    wrap.innerHTML = `
      <input type="text" id="sidebar-filter-input" class="sidebar-filter-input" placeholder="🔍 목록 빠른 검색..." aria-label="사이드바 목록 필터">
    `;
    nav.parentNode.insertBefore(wrap, nav);

    const input = wrap.querySelector('input');
    input.addEventListener('input', function() {
      const q = this.value.trim().toLowerCase();
      items.forEach(li => {
        // Keep section headers if any child matches
        if (li.classList.contains('sidebar-item-section')) return;
        const txt = li.textContent.toLowerCase();
        li.style.display = (!q || txt.includes(q)) ? '' : 'none';
      });
      // Hide empty section groups
      nav.querySelectorAll('li.sidebar-item-section').forEach(sec => {
        const subItems = Array.from(sec.querySelectorAll('li.sidebar-item:not(.sidebar-item-section)'));
        if (subItems.length) {
          const anyVisible = subItems.some(si => si.style.display !== 'none');
          sec.style.display = anyVisible ? '' : 'none';
        }
      });
    });
  }

  function setupSmartTableFilters(mainContent) {
    const tables = Array.from(mainContent.querySelectorAll('table'));
    tables.forEach(tbl => {
      const rows = Array.from(tbl.querySelectorAll('tbody tr'));
      if (rows.length < 12) return;

      const bar = document.createElement('div');
      bar.className = 'smart-table-toolbar';
      bar.innerHTML = `
        <input type="text" class="smart-table-filter-input" placeholder="🔍 표 내 항목 빠른 필터링 (${rows.length}개 행)..." aria-label="표 데이터 필터">
        <span class="smart-table-count">${rows.length} / ${rows.length}</span>
      `;
      tbl.parentNode.insertBefore(bar, tbl);

      const input = bar.querySelector('input');
      const countEl = bar.querySelector('.smart-table-count');
      input.addEventListener('input', function() {
        const q = this.value.trim().toLowerCase();
        let shown = 0;
        rows.forEach(r => {
          const match = !q || r.textContent.toLowerCase().includes(q);
          r.style.display = match ? '' : 'none';
          if (match) shown++;
        });
        countEl.textContent = `${shown} / ${rows.length}`;
      });
    });
  }

  function insertToolbar(mainContent) {
    if (document.getElementById('doc-view-toolbar')) return;

    const toolbar = document.createElement('div');
    toolbar.id = 'doc-view-toolbar';
    toolbar.className = 'doc-view-toolbar';
    toolbar.innerHTML = `
      <div class="view-toolbar-left">
        <span class="view-toolbar-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          화면 도구:
        </span>
        <button type="button" id="btn-toggle-left" class="view-tool-btn" title="사이드바 메뉴 접기/펼치기 (단축키: [ )">
          <span class="btn-icon">◧</span>
          <span class="btn-label">메뉴 접기</span>
        </button>
        <button type="button" id="btn-toggle-right" class="view-tool-btn" title="우측 목차 접기/펼치기 (단축키: ] )">
          <span class="btn-icon">◨</span>
          <span class="btn-label">목차 접기</span>
        </button>
        <button type="button" id="btn-toggle-focus" class="view-tool-btn focus-btn" title="양쪽 사이드바를 모두 접고 본문을 넓게 집중해서 봅니다 (단축키: \\ )">
          <span class="btn-icon">📖</span>
          <span class="btn-label">넓게 보기</span>
        </button>
        <button type="button" id="btn-toggle-theme" class="view-tool-btn" title="다크 모드 / 라이트 모드 전환 (단축키: D)">
          <span class="btn-icon">🌙</span>
          <span class="btn-label">다크 모드</span>
        </button>
        <div class="font-size-group">
          <button type="button" id="btn-font-smaller" class="view-tool-btn font-btn" title="글자 작게">A-</button>
          <button type="button" id="btn-font-larger" class="view-tool-btn font-btn" title="글자 크게">A+</button>
        </div>
      </div>
      <div class="view-toolbar-right">
        <span class="view-toolbar-hint">💡 단축키: <kbd>/</kbd> 검색 · <kbd>[</kbd><kbd>]</kbd> 사이드바 · <kbd>D</kbd> 다크모드 · <kbd>?</kbd> 도움말</span>
      </div>
    `;

    const headerCard = mainContent.querySelector('.doc-header-card');
    if (headerCard && headerCard.parentNode) {
      headerCard.parentNode.insertBefore(toolbar, headerCard);
    } else {
      const titleBlock = mainContent.querySelector('#title-block-header');
      if (titleBlock && titleBlock.nextSibling) {
        titleBlock.parentNode.insertBefore(toolbar, titleBlock.nextSibling);
      } else {
        mainContent.prepend(toolbar);
      }
    }

    const btnLeft = document.getElementById('btn-toggle-left');
    const btnRight = document.getElementById('btn-toggle-right');
    const btnFocus = document.getElementById('btn-toggle-focus');
    const btnTheme = document.getElementById('btn-toggle-theme');
    const btnFontSmaller = document.getElementById('btn-font-smaller');
    const btnFontLarger = document.getElementById('btn-font-larger');

    if (btnLeft) btnLeft.addEventListener('click', function() { toggleLeftSidebar(); });
    if (btnRight) btnRight.addEventListener('click', function() { toggleRightSidebar(); });
    if (btnFocus) btnFocus.addEventListener('click', function() { toggleFocusMode(); });
    if (btnTheme) btnTheme.addEventListener('click', toggleDarkMode);
    if (btnFontSmaller) btnFontSmaller.addEventListener('click', function() { adjustFontSize(mainContent, -1); });
    if (btnFontLarger) btnFontLarger.addEventListener('click', function() { adjustFontSize(mainContent, 1); });
  }

  function adjustFontSize(mainContent, delta) {
    const current = window.getComputedStyle(mainContent).fontSize;
    const currentPx = parseFloat(current) || 16;
    const newPx = Math.max(14, Math.min(22, currentPx + delta));
    mainContent.style.fontSize = newPx + 'px';
    localStorage.setItem('exchange_font_size', newPx + 'px');
  }

  function bindEdgeHandles() {
    const handleLeft = document.getElementById('handle-sidebar-left');
    const handleRight = document.getElementById('handle-sidebar-right');
    if (handleLeft) handleLeft.addEventListener('click', function() { toggleLeftSidebar(true); });
    if (handleRight) handleRight.addEventListener('click', function() { toggleRightSidebar(true); });
  }

  function toggleLeftSidebar(forceExpand) {
    const body = document.body;
    let isCollapsed = body.classList.contains('sidebar-left-collapsed');
    if (forceExpand === true) isCollapsed = true;

    if (isCollapsed) {
      body.classList.remove('sidebar-left-collapsed', 'focus-mode-enabled');
      localStorage.setItem('exchange_sidebar_left', 'expanded');
      localStorage.setItem('exchange_focus_mode', 'false');
    } else {
      body.classList.add('sidebar-left-collapsed');
      localStorage.setItem('exchange_sidebar_left', 'collapsed');
    }
    updateToolbarButtons();
  }

  function toggleRightSidebar(forceExpand) {
    const body = document.body;
    let isCollapsed = body.classList.contains('sidebar-right-collapsed');
    if (forceExpand === true) isCollapsed = true;

    if (isCollapsed) {
      body.classList.remove('sidebar-right-collapsed', 'focus-mode-enabled');
      localStorage.setItem('exchange_sidebar_right', 'expanded');
      localStorage.setItem('exchange_focus_mode', 'false');
    } else {
      body.classList.add('sidebar-right-collapsed');
      localStorage.setItem('exchange_sidebar_right', 'collapsed');
    }
    updateToolbarButtons();
  }

  function toggleFocusMode() {
    const body = document.body;
    const isFocus = body.classList.contains('focus-mode-enabled');

    if (isFocus) {
      body.classList.remove('focus-mode-enabled', 'sidebar-left-collapsed', 'sidebar-right-collapsed');
      localStorage.setItem('exchange_focus_mode', 'false');
      localStorage.setItem('exchange_sidebar_left', 'expanded');
      localStorage.setItem('exchange_sidebar_right', 'expanded');
    } else {
      body.classList.add('focus-mode-enabled', 'sidebar-left-collapsed', 'sidebar-right-collapsed');
      localStorage.setItem('exchange_focus_mode', 'true');
      localStorage.setItem('exchange_sidebar_left', 'collapsed');
      localStorage.setItem('exchange_sidebar_right', 'collapsed');
    }
    updateToolbarButtons();
  }

  function updateToolbarButtons() {
    const body = document.body;
    const btnLeft = document.getElementById('btn-toggle-left');
    const btnRight = document.getElementById('btn-toggle-right');
    const btnFocus = document.getElementById('btn-toggle-focus');

    const leftCollapsed = body.classList.contains('sidebar-left-collapsed');
    const rightCollapsed = body.classList.contains('sidebar-right-collapsed');
    const isFocus = body.classList.contains('focus-mode-enabled');

    if (btnLeft) {
      btnLeft.classList.toggle('active', leftCollapsed);
      btnLeft.querySelector('.btn-label').textContent = leftCollapsed ? '메뉴 열기' : '메뉴 접기';
      btnLeft.querySelector('.btn-icon').textContent = leftCollapsed ? '▥' : '◧';
    }
    if (btnRight) {
      btnRight.classList.toggle('active', rightCollapsed);
      btnRight.querySelector('.btn-label').textContent = rightCollapsed ? '목차 열기' : '목차 접기';
      btnRight.querySelector('.btn-icon').textContent = rightCollapsed ? '▥' : '◨';
    }
    if (btnFocus) {
      btnFocus.classList.toggle('active', isFocus);
      btnFocus.querySelector('.btn-label').textContent = isFocus ? '기본 뷰 복원' : '넓게 보기';
      btnFocus.querySelector('.btn-icon').textContent = isFocus ? '↺' : '📖';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGlobalPortalUX);
  } else {
    initGlobalPortalUX();
  }
})();
</script>
