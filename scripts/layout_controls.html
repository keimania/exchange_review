<!-- Layout Controls & Responsive Tablet Enhancements -->
<aside id="floating-dock-handles" aria-label="사이드바 독 제어 핸들">
  <button id="handle-sidebar-left" class="edge-dock-handle left-handle" title="좌측 메뉴 열기 (단축키: [ )" aria-label="좌측 메뉴 열기">
    <span class="handle-icon">❯</span>
    <span class="handle-text">메뉴 열기</span>
  </button>
  <button id="handle-sidebar-right" class="edge-dock-handle right-handle" title="우측 목차 열기 (단축키: ] )" aria-label="우측 목차 열기">
    <span class="handle-icon">❮</span>
    <span class="handle-text">목차 열기</span>
  </button>
</aside>

<script>
(function() {
  function initLayoutControls() {
    const leftSidebar = document.getElementById('quarto-sidebar');
    const rightSidebar = document.getElementById('quarto-margin-sidebar');
    const mainContent = document.getElementById('quarto-document-content');
    
    // Bail out if not a content page with sidebars
    if (!mainContent || (!leftSidebar && !rightSidebar)) {
      return;
    }

    const body = document.body;
    const isTablet = window.innerWidth <= 1250;

    // Load saved preferences or smart tablet defaults
    const savedLeft = localStorage.getItem('exchange_sidebar_left');
    const savedRight = localStorage.getItem('exchange_sidebar_right');
    const savedFocus = localStorage.getItem('exchange_focus_mode');
    const savedFontSize = localStorage.getItem('exchange_font_size');

    if (savedFontSize) {
      mainContent.style.fontSize = savedFontSize;
    }

    if (savedFocus === 'true') {
      body.classList.add('focus-mode-enabled');
      body.classList.add('sidebar-left-collapsed');
      body.classList.add('sidebar-right-collapsed');
    } else {
      if (savedLeft === 'collapsed') {
        body.classList.add('sidebar-left-collapsed');
      }
      
      // On tablets, if no explicit right sidebar preference saved, default to collapsed for maximum reading space
      if (savedRight === 'collapsed' || (isTablet && savedRight === null)) {
        body.classList.add('sidebar-right-collapsed');
      }
    }

    // Insert top toolbar in document header
    insertToolbar(mainContent);
    
    // Bind edge handles
    bindEdgeHandles();

    // Drawer close handler for tablet right sidebar
    if (rightSidebar) {
      rightSidebar.addEventListener('click', function(e) {
        if (e.target.classList.contains('toc-close-trigger') || (e.clientY < 110 && e.clientX > window.innerWidth - 60)) {
          toggleRightSidebar();
        }
      });
    }

    // Listen to keyboard shortcuts: [ for left, ] for right, \ for focus mode
    document.addEventListener('keydown', function(e) {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      
      if (e.key === '[') {
        e.preventDefault();
        toggleLeftSidebar();
      } else if (e.key === ']') {
        e.preventDefault();
        toggleRightSidebar();
      } else if (e.key === '\\') {
        e.preventDefault();
        toggleFocusMode();
      }
    });

    updateToolbarButtons();
  }

  function insertToolbar(mainContent) {
    if (document.getElementById('doc-view-toolbar')) return;

    const toolbar = document.createElement('div');
    toolbar.id = 'doc-view-toolbar';
    toolbar.className = 'doc-view-toolbar';
    toolbar.innerHTML = `
      <div class="view-toolbar-left">
        <span class="view-toolbar-label">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:4px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
          화면 보기:
        </span>
        <button type="button" id="btn-toggle-left" class="view-tool-btn" title="사이드바 메뉴 접기/펼치기 (단축키: [ )">
          <span class="btn-icon">◧</span>
          <span class="btn-label">메뉴 접기</span>
        </button>
        <button type="button" id="btn-toggle-right" class="view-tool-btn" title="우측 목차 접기/펼치기 (단축키: ] )">
          <span class="btn-icon">◨</span>
          <span class="btn-label">목차 접기</span>
        </button>
        <button type="button" id="btn-toggle-focus" class="view-tool-btn focus-btn" title="양쪽 사이드바를 모두 접고 본문을 넓게 집중해서 봅니다 (단축키: \\ )">
          <span class="btn-icon">📖</span>
          <span class="btn-label">넓게 보기 (집중 모드)</span>
        </button>
        <div class="font-size-group">
          <button type="button" id="btn-font-smaller" class="view-tool-btn font-btn" title="글자 작게">A-</button>
          <button type="button" id="btn-font-larger" class="view-tool-btn font-btn" title="글자 크게">A+</button>
        </div>
      </div>
      <div class="view-toolbar-right">
        <span class="view-toolbar-hint">💡 태블릿/노트북에서는 사이드바를 접어 본문을 시원하게 읽으실 수 있습니다.</span>
      </div>
    `;

    // Try inserting right above .doc-header-card or title block
    const headerCard = mainContent.querySelector('.doc-header-card');
    if (headerCard && headerCard.parentNode) {
      headerCard.parentNode.insertBefore(toolbar, headerCard);
    } else {
      const titleBlock = mainContent.querySelector('#title-block-header');
      if (titleBlock && titleBlock.nextSibling) {
        titleBlock.parentNode.insertBefore(toolbar, titleBlock.nextSibling);
      } else {
        mainContent.prepend(toolbar);
      }
    }

    // Attach event listeners
    const btnLeft = document.getElementById('btn-toggle-left');
    const btnRight = document.getElementById('btn-toggle-right');
    const btnFocus = document.getElementById('btn-toggle-focus');
    const btnFontSmaller = document.getElementById('btn-font-smaller');
    const btnFontLarger = document.getElementById('btn-font-larger');

    if (btnLeft) btnLeft.addEventListener('click', function() { toggleLeftSidebar(); });
    if (btnRight) btnRight.addEventListener('click', function() { toggleRightSidebar(); });
    if (btnFocus) btnFocus.addEventListener('click', function() { toggleFocusMode(); });
    
    if (btnFontSmaller) {
      btnFontSmaller.addEventListener('click', function() {
        adjustFontSize(mainContent, -1);
      });
    }
    if (btnFontLarger) {
      btnFontLarger.addEventListener('click', function() {
        adjustFontSize(mainContent, 1);
      });
    }
  }

  function adjustFontSize(mainContent, delta) {
    const current = window.getComputedStyle(mainContent).fontSize;
    const currentPx = parseFloat(current) || 16;
    const newPx = Math.max(14, Math.min(22, currentPx + delta));
    mainContent.style.fontSize = newPx + 'px';
    localStorage.setItem('exchange_font_size', newPx + 'px');
  }

  function bindEdgeHandles() {
    const handleLeft = document.getElementById('handle-sidebar-left');
    const handleRight = document.getElementById('handle-sidebar-right');

    if (handleLeft) {
      handleLeft.addEventListener('click', function() {
        toggleLeftSidebar(true);
      });
    }
    if (handleRight) {
      handleRight.addEventListener('click', function() {
        toggleRightSidebar(true);
      });
    }
  }

  function toggleLeftSidebar(forceExpand) {
    const body = document.body;
    let isCollapsed = body.classList.contains('sidebar-left-collapsed');
    
    if (forceExpand === true) {
      isCollapsed = true;
    }

    if (isCollapsed) {
      body.classList.remove('sidebar-left-collapsed');
      localStorage.setItem('exchange_sidebar_left', 'expanded');
      body.classList.remove('focus-mode-enabled');
      localStorage.setItem('exchange_focus_mode', 'false');
    } else {
      body.classList.add('sidebar-left-collapsed');
      localStorage.setItem('exchange_sidebar_left', 'collapsed');
    }
    updateToolbarButtons();
  }

  function toggleRightSidebar(forceExpand) {
    const body = document.body;
    let isCollapsed = body.classList.contains('sidebar-right-collapsed');

    if (forceExpand === true) {
      isCollapsed = true;
    }

    if (isCollapsed) {
      body.classList.remove('sidebar-right-collapsed');
      localStorage.setItem('exchange_sidebar_right', 'expanded');
      body.classList.remove('focus-mode-enabled');
      localStorage.setItem('exchange_focus_mode', 'false');
    } else {
      body.classList.add('sidebar-right-collapsed');
      localStorage.setItem('exchange_sidebar_right', 'collapsed');
    }
    updateToolbarButtons();
  }

  function toggleFocusMode() {
    const body = document.body;
    const isFocus = body.classList.contains('focus-mode-enabled');

    if (isFocus) {
      body.classList.remove('focus-mode-enabled');
      body.classList.remove('sidebar-left-collapsed');
      body.classList.remove('sidebar-right-collapsed');
      localStorage.setItem('exchange_focus_mode', 'false');
      localStorage.setItem('exchange_sidebar_left', 'expanded');
      localStorage.setItem('exchange_sidebar_right', 'expanded');
    } else {
      body.classList.add('focus-mode-enabled');
      body.classList.add('sidebar-left-collapsed');
      body.classList.add('sidebar-right-collapsed');
      localStorage.setItem('exchange_focus_mode', 'true');
      localStorage.setItem('exchange_sidebar_left', 'collapsed');
      localStorage.setItem('exchange_sidebar_right', 'collapsed');
    }
    updateToolbarButtons();
  }

  function updateToolbarButtons() {
    const body = document.body;
    const btnLeft = document.getElementById('btn-toggle-left');
    const btnRight = document.getElementById('btn-toggle-right');
    const btnFocus = document.getElementById('btn-toggle-focus');

    const leftCollapsed = body.classList.contains('sidebar-left-collapsed');
    const rightCollapsed = body.classList.contains('sidebar-right-collapsed');
    const isFocus = body.classList.contains('focus-mode-enabled');

    if (btnLeft) {
      if (leftCollapsed) {
        btnLeft.classList.add('active');
        btnLeft.querySelector('.btn-label').textContent = '메뉴 열기';
        btnLeft.querySelector('.btn-icon').textContent = '▥';
      } else {
        btnLeft.classList.remove('active');
        btnLeft.querySelector('.btn-label').textContent = '메뉴 접기';
        btnLeft.querySelector('.btn-icon').textContent = '◧';
      }
    }

    if (btnRight) {
      if (rightCollapsed) {
        btnRight.classList.add('active');
        btnRight.querySelector('.btn-label').textContent = '목차 열기';
        btnRight.querySelector('.btn-icon').textContent = '▥';
      } else {
        btnRight.classList.remove('active');
        btnRight.querySelector('.btn-label').textContent = '목차 접기';
        btnRight.querySelector('.btn-icon').textContent = '◨';
      }
    }

    if (btnFocus) {
      if (isFocus) {
        btnFocus.classList.add('active');
        btnFocus.querySelector('.btn-label').textContent = '기본 뷰로 복원';
        btnFocus.querySelector('.btn-icon').textContent = '↺';
      } else {
        btnFocus.classList.remove('active');
        btnFocus.querySelector('.btn-label').textContent = '넓게 보기 (집중 모드)';
        btnFocus.querySelector('.btn-icon').textContent = '📖';
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLayoutControls);
  } else {
    initLayoutControls();
  }
})();
</script>
