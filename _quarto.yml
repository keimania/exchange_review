format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    toc-title: "목차 (Contents)"
    toc-depth: 3
    number-sections: false
    smooth-scroll: true
    link-external-newwindow: true
    page-navigation: true
    back-to-top-navigation: true
    include-after-body:
      - scripts/layout_controls.html
    grid:
      sidebar-width: 270px
      body-width: 1050px
      margin-width: 260px
